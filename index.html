<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary SEO ───────────────────────────────────── -->
    <title>Lyann Fernandes — Full Stack Developer</title>
    <meta
      name="description"
      content="Lyann Fernandes is a full stack developer and BSc Computer Science student from Mumbai building responsive websites and digital experiences."
    />
    <meta name="author" content="Lyann Fernandes" />
    <meta name="robots" content="index, follow" />

    <!-- ── Theme color ──────────────────────────────────── -->
    <meta name="theme-color" content="#faf9f5" />

    <!-- ── Open Graph ───────────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lyannfernandes.com/" />
    <meta property="og:title" content="Lyann Fernandes — Full Stack Developer" />
    <meta
      property="og:description"
      content="Full stack developer and BSc Computer Science student from Mumbai. Building responsive websites and digital experiences."
    />
    <meta property="og:image" content="/assets/portrait.png" />
    <meta property="og:site_name" content="Lyann Fernandes" />

    <!-- ── Twitter / X ──────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lyann Fernandes — Full Stack Developer" />
    <meta
      name="twitter:description"
      content="Full stack developer and BSc Computer Science student from Mumbai."
    />
    <meta name="twitter:image" content="/assets/portrait.png" />

    <!-- ── Canonical ────────────────────────────────────── -->
    <link rel="canonical" href="https://lyannfernandes.com/" />

    <!-- ── Favicon ───────────────────────────────────────── -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- ── Font preconnect ──────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ── Typography ───────────────────────────────────── -->
    <!-- Newsreader (editorial serif) · Manrope (grotesque) · JetBrains Mono -->
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;family=Manrope:wght@300;400;500;600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;display=swap"
      rel="stylesheet"
    />

    <!-- ── Material Symbols Outlined (UI icons) ─────────── -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />

    <!-- ── JSON-LD structured data ──────────────────────── -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Lyann Fernandes",
        "jobTitle": "Full Stack Developer",
        "description": "BSc Computer Science student and full stack developer from Mumbai, India.",
        "url": "https://lyannfernandes.com/",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Mumbai",
          "addressCountry": "India"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
