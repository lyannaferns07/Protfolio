<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="ai-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f24" />
      <stop offset="50%" stop-color="#201538" />
      <stop offset="100%" stop-color="#0b0816" />
    </linearGradient>
    <linearGradient id="ai-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <pattern id="ai-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(168, 85, 247, 0.08)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#ai-bg)" />
  <rect width="1200" height="675" fill="url(#ai-grid)" />

  <!-- Prototype Split Window -->
  <g transform="translate(100, 75)">
    <!-- Main Window Frame -->
    <rect width="1000" height="525" rx="16" fill="rgba(18, 14, 30, 0.95)" stroke="rgba(168, 85, 247, 0.25)" stroke-width="1.5" />

    <!-- Window Top Header -->
    <rect width="1000" height="54" rx="16" fill="rgba(255, 255, 255, 0.04)" />
    <circle cx="36" cy="27" r="6" fill="#ef4444" opacity="0.8" />
    <circle cx="56" cy="27" r="6" fill="#eab308" opacity="0.8" />
    <circle cx="76" cy="27" r="6" fill="#22c55e" opacity="0.8" />
    <text x="500" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#c084fc" text-anchor="middle">Assist AI &#8226; Interface Synthesis Workspace</text>

    <!-- Left Column: Prompting & Iteration Panel -->
    <g transform="translate(30, 75)">
      <rect width="420" height="420" rx="12" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" />
      
      <text x="24" y="36" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1" fill="#ec4899" text-transform="uppercase">PROMPT CONTROLS</text>

      <!-- Prompt Input Box -->
      <rect x="24" y="52" width="372" height="96" rx="8" fill="rgba(0, 0, 0, 0.3)" stroke="rgba(168, 85, 247, 0.3)" />
      <text x="40" y="80" font-family="-apple-system, sans-serif" font-size="13" fill="#e9d5ff">&quot;Generate a modern analytics dashboard card</text>
      <text x="40" y="102" font-family="-apple-system, sans-serif" font-size="13" fill="#e9d5ff">with metric growth sparklines and dark theme&quot;</text>
      <circle cx="376" cy="126" r="10" fill="#a855f7" />
      <text x="376" y="130" font-family="-apple-system, sans-serif" font-size="12" fill="#fff" text-anchor="middle">&#8629;</text>

      <!-- Iteration History List -->
      <text x="24" y="180" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1" fill="#94a3b8" text-transform="uppercase">GENERATION HISTORY</text>
      
      <rect x="24" y="196" width="372" height="48" rx="6" fill="rgba(168, 85, 247, 0.1)" stroke="rgba(168, 85, 247, 0.2)" />
      <text x="40" y="225" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#f8fafc">v3: Added gradient sparklines &amp; badge</text>
      
      <rect x="24" y="254" width="372" height="48" rx="6" fill="rgba(255, 255, 255, 0.02)" />
      <text x="40" y="283" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">v2: Adjusted responsive layout &amp; tokens</text>

      <rect x="24" y="312" width="372" height="48" rx="6" fill="rgba(255, 255, 255, 0.02)" />
      <text x="40" y="341" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">v1: Initial layout structure</text>
    </g>

    <!-- Right Column: Live Synthesis Canvas -->
    <g transform="translate(480, 75)">
      <rect width="490" height="420" rx="12" fill="rgba(0, 0, 0, 0.4)" stroke="rgba(236, 72, 153, 0.25)" />
      <text x="24" y="36" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1" fill="#c084fc" text-transform="uppercase">LIVE GENERATED PREVIEW</text>

      <!-- Synthesized Analytics Card -->
      <g transform="translate(35, 60)">
        <rect width="420" height="320" rx="14" fill="#1b152b" stroke="rgba(255, 255, 255, 0.12)" />
        
        <text x="24" y="42" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#94a3b8">Total Conversion Telemetry</text>
        <text x="24" y="80" font-family="-apple-system, sans-serif" font-size="32" font-weight="700" fill="#f8fafc">94.8%</text>
        <rect x="150" y="58" width="68" height="24" rx="12" fill="rgba(74, 222, 128, 0.15)" />
        <text x="184" y="74" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle">+14.2% &#8593;</text>

        <!-- Sparkline Curve -->
        <path d="M 24 230 Q 80 140 140 190 T 260 110 T 390 80" fill="none" stroke="url(#ai-glow)" stroke-width="4" stroke-linecap="round" />
        <path d="M 24 230 Q 80 140 140 190 T 260 110 T 390 80 L 390 260 L 24 260 Z" fill="url(#ai-glow)" opacity="0.1" />

        <g transform="translate(24, 270)">
          <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b">MON</text>
          <text x="70" y="0" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b">TUE</text>
          <text x="140" y="0" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b">WED</text>
          <text x="210" y="0" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b">THU</text>
          <text x="280" y="0" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b">FRI</text>
          <text x="350" y="0" font-family="-apple-system, sans-serif" font-size="11" fill="#c084fc">TODAY</text>
        </g>
      </g>
    </g>
  </g>
</svg>
